# =============================================================================
# World Monitor — local test overlay (website / Web service-outages)
# =============================================================================
# Isolates this checkout under project name worldmonitor-web-outages-test so it
# does not collide with a default `docker compose up` of the same stack.
#
# Preferred (Compose include):
#   docker compose -f docker-compose.test.yml up -d --build
#
# Equivalent merge (no include support needed):
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build
#
# Or use: bash scripts/docker-test-up.sh
# Docs: DOCKER_TEST.md
# =============================================================================

name: worldmonitor-web-outages-test

include:
  - path: docker-compose.yml
